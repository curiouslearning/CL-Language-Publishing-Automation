# PR check (spec 009, trigger ftm-pr-check): builds the image from the pull request's code so a broken
# Dockerfile or requirements.txt fails before merging. Nothing is pushed or deployed, and the build identity
# (ftm-pr-builder) can only write logs: no secrets, no access to the live service.
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/ftm-pr-builder@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "ftm-pr-check:${SHORT_SHA}", "."]
